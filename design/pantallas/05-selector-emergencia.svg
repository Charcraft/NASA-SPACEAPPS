<svg xmlns="http://www.w3.org/2000/svg" width="412" height="917" viewBox="0 0 412 917" fill="none">
  <defs>
    <linearGradient id="bgGrad05" x1="206" y1="0" x2="206" y2="917" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090C14"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="redCard05" x1="24" y1="190" x2="388" y2="302" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A1215"/>
      <stop offset="100%" stop-color="#131A27"/>
    </linearGradient>
  </defs>

  <!-- Fondo principal -->
  <rect width="412" height="917" rx="28" fill="url(#bgGrad05)"/>

  <!-- Barra de estado -->
  <g id="StatusBar05">
    <text x="24" y="26" fill="#F6F7FB" font-family="Inter, sans-serif" font-size="12" font-weight="600">14:31 UTC</text>
    <circle cx="250" cy="22" r="3.5" fill="#EF4444"/>
    <text x="259" y="26" fill="#FCA5A5" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">MODO EMERGENCIA · LOCAL</text>
  </g>

  <!-- Cabecera -->
  <g id="Header05">
    <rect x="24" y="44" width="96" height="36" rx="12" fill="#131A27"/>
    <text x="38" y="66" fill="#F6F7FB" font-family="Inter, sans-serif" font-size="13" font-weight="600">← Salir</text>
    <text x="136" y="60" fill="#F6F7FB" font-family="Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="0.3">SELECTOR DE EMERGENCIA</text>
    <text x="136" y="76" fill="#9BA4B8" font-family="JetBrains Mono, monospace" font-size="9" font-weight="500">C003 · UN TOQUE, SIN CONFIRMAR</text>
  </g>

  <!-- Aviso de contexto -->
  <g id="Context05">
    <rect x="24" y="96" width="364" height="56" rx="16" fill="#2A1215" stroke="#EF4444" stroke-width="1.5"/>
    <circle cx="46" cy="124" r="10" fill="#EF4444"/>
    <text x="46" y="128" fill="#11180A" font-family="Inter, sans-serif" font-size="12" font-weight="800" text-anchor="middle">!</text>
    <text x="64" y="120" fill="#F6F7FB" font-family="Inter, sans-serif" font-size="12.5" font-weight="700">Nadie puede decidir por ti en 20 min</text>
    <text x="64" y="136" fill="#FCA5A5" font-family="Inter, sans-serif" font-size="10" font-weight="500">Elige el cuadro que se parezca: la app pregunta el resto.</text>
  </g>

  <!-- Paso 1: elegir cuadro -->
  <text x="24" y="180" fill="#9BA4B8" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" letter-spacing="0.8">1 · ELIGE EL CUADRO</text>

  <!-- Protocolo 1: dolor torácico -->
  <g id="ProtocolChest">
    <rect x="24" y="190" width="364" height="112" rx="18" fill="url(#redCard05)" stroke="#EF4444" stroke-width="2"/>
    <rect x="24" y="206" width="4" height="80" rx="2" fill="#EF4444"/>
    <text x="46" y="224" fill="#F6F7FB" font-family="Inter, sans-serif" font-size="17" font-weight="800" letter-spacing="0.2">DOLOR TORÁCICO</text>
    <text x="46" y="243" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="10.5" font-weight="400">Opresión, ardor o dolor que baja al brazo izquierdo</text>
    <rect x="46" y="256" width="62" height="20" rx="6" fill="#1E293B"/>
    <text x="54" y="269" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600">6 PASOS</text>
    <rect x="114" y="256" width="68" height="20" rx="6" fill="#1E293B"/>
    <text x="122" y="269" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600">≈ 12 MIN</text>
    <text x="46" y="291" fill="#FCA5A5" font-family="Inter, sans-serif" font-size="9.5" font-weight="600">El más frecuente en vuelo · Empieza ya</text>
    <circle cx="348" cy="222" r="19" fill="#2A1215" stroke="#EF4444" stroke-width="1.5"/>
    <path d="M348 230 L340 222 A5 5 0 0 1 348 216 A5 5 0 0 1 356 222 Z" fill="#EF4444"/>
  </g>

  <!-- Protocolo 2: hipoxia -->
  <g id="ProtocolHypoxia">
    <rect x="24" y="312" width="364" height="100" rx="18" fill="#131A27" stroke="#1E293B" stroke-width="1"/>
    <text x="46" y="342" fill="#F6F7FB" font-family="Inter, sans-serif" font-size="15" font-weight="700">HIPOXIA · FALLO DE O₂</text>
    <text x="46" y="360" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="10" font-weight="400">Confusión, cefalea, visión borrosa o alarma de cabina</text>
    <rect x="46" y="372" width="56" height="20" rx="6" fill="#1E293B"/>
    <text x="54" y="385" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600">5 PASOS</text>
    <rect x="108" y="372" width="60" height="20" rx="6" fill="#1E293B"/>
    <text x="116" y="385" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600">≈ 8 MIN</text>
    <circle cx="348" cy="338" r="19" fill="#131A27" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="348" y="344" fill="#38BDF8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" text-anchor="middle">O₂</text>
  </g>

  <!-- Protocolo 3: anafilaxia -->
  <g id="ProtocolAnaphylaxis">
    <rect x="24" y="424" width="364" height="100" rx="18" fill="#131A27" stroke="#1E293B" stroke-width="1"/>
    <text x="46" y="454" fill="#F6F7FB" font-family="Inter, sans-serif" font-size="15" font-weight="700">ANAFILAXIA</text>
    <text x="46" y="472" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="10" font-weight="400">Ronchas, labios hinchados o silbido al respirar</text>
    <rect x="46" y="484" width="56" height="20" rx="6" fill="#1E293B"/>
    <text x="54" y="497" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600">5 PASOS</text>
    <rect x="108" y="484" width="64" height="20" rx="6" fill="#1E293B"/>
    <text x="116" y="497" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600">≈ 10 MIN</text>
    <circle cx="348" cy="450" r="19" fill="#131A27" stroke="#F59E0B" stroke-width="1.5"/>
    <path d="M348 443 L342 456 L354 456 Z" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="348" y1="447" x2="348" y2="451" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Paso 2: ayuda si no lo reconoce -->
  <text x="24" y="556" fill="#9BA4B8" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" letter-spacing="0.8">2 · SI NO SABES QUÉ ES</text>

  <g id="HelpTree">
    <rect x="24" y="566" width="364" height="96" rx="18" fill="#131A27" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="46" y="594" fill="#38BDF8" font-family="Inter, sans-serif" font-size="14" font-weight="700">NO SÉ QUÉ HACER</text>
    <text x="46" y="613" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="10" font-weight="400">3 preguntas cerradas en 20 segundos</text>
    <text x="46" y="629" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="10" font-weight="400">¿Puede hablar? · ¿Respira? · ¿Dónde duele?</text>
    <text x="364" y="620" fill="#38BDF8" font-family="Inter, sans-serif" font-size="20" font-weight="700" text-anchor="end">→</text>
  </g>

  <!-- Registro local -->
  <g id="LogNote">
    <rect x="24" y="674" width="364" height="54" rx="14" fill="#131A27" stroke="#1E293B" stroke-width="1"/>
    <circle cx="44" cy="701" r="4" fill="#D9FB76"/>
    <text x="56" y="697" fill="#F6F7FB" font-family="Inter, sans-serif" font-size="10.5" font-weight="600">La selección y la hora quedan en el registro local</text>
    <text x="56" y="712" fill="#9BA4B8" font-family="JetBrains Mono, monospace" font-size="9" font-weight="500">Se enviará a Tierra en la próxima ventana · delay +14m</text>
  </g>

  <!-- Salida secundaria -->
  <rect x="24" y="742" width="364" height="48" rx="24" fill="#131A27" stroke="#1E293B" stroke-width="1"/>
  <text x="206" y="771" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Salir del modo emergencia</text>

  <!-- Barra de navegación inferior -->
  <g id="BottomNav05">
    <rect x="24" y="842" width="364" height="42" rx="21" fill="#131A27" stroke="#1E293B" stroke-width="1"/>
    <text x="47" y="867" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="11" font-weight="500">Dashboard</text>
    <text x="142" y="867" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="11" font-weight="500">Cuerpo 3D</text>
    <text x="234" y="867" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="11" font-weight="500">Medición</text>
    <rect x="300" y="846" width="76" height="34" rx="17" fill="#2A1215"/>
    <text x="316" y="867" fill="#FCA5A5" font-family="Inter, sans-serif" font-size="11" font-weight="700">Protocolos</text>
  </g>

  <text x="58" y="898" fill="#64748B" font-family="Inter, sans-serif" font-size="8.5" font-weight="500">Prototipo educativo NASA Space Apps 2026 · No es un dispositivo médico.</text>
  <rect x="142" y="906" width="128" height="4" rx="2" fill="#F6F7FB" fill-opacity="0.4"/>
</svg>
