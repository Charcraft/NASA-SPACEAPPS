<svg xmlns="http://www.w3.org/2000/svg" width="412" height="917" viewBox="0 0 412 917" fill="none">
  <defs>
    <linearGradient id="bgGrad03" x1="206" y1="0" x2="206" y2="917" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090C14"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
  </defs>

  <rect width="412" height="917" rx="28" fill="url(#bgGrad03)"/>

  <!-- Barra de estado -->
  <text x="24" y="26" fill="#F6F7FB" font-family="Inter, sans-serif" font-size="12" font-weight="600">14:25 UTC</text>
  <text x="259" y="26" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="10" font-weight="500">MODO GUIADO · PASO 2/3</text>

  <!-- Cabecera -->
  <rect x="24" y="44" width="96" height="36" rx="12" fill="#131A27"/>
  <text x="38" y="66" fill="#F6F7FB" font-family="Inter, sans-serif" font-size="13" font-weight="600">←  Volver</text>
  <text x="136" y="60" fill="#F6F7FB" font-family="Inter, sans-serif" font-size="15" font-weight="700">MEDICIÓN GUIADA</text>
  <text x="136" y="76" fill="#D9FB76" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">GLUCOSA EN SANGRE (i-STAT / PUNCIÓN)</text>

  <!-- Barra de progreso de 3 pasos -->
  <g id="StepProgress">
    <rect x="24" y="94" width="116" height="6" rx="3" fill="#10B981"/>
    <rect x="148" y="94" width="116" height="6" rx="3" fill="#D9FB76"/>
    <rect x="272" y="94" width="116" height="6" rx="3" fill="#1E293B"/>
    <text x="24" y="114" fill="#10B981" font-family="Inter, sans-serif" font-size="9" font-weight="600">1. Preparación ✓</text>
    <text x="148" y="114" fill="#D9FB76" font-family="Inter, sans-serif" font-size="9" font-weight="700">2. Toma en microgravedad</text>
    <text x="272" y="114" fill="#64748B" font-family="Inter, sans-serif" font-size="9" font-weight="500">3. Evaluación</text>
  </g>

  <!-- Tarjeta de instrucción paso a paso para no-clínicos -->
  <g id="InstructionCard">
    <rect x="24" y="128" width="364" height="224" rx="18" fill="#131A27" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Ilustración vectorial de toma capilar en 0G -->
    <rect x="40" y="144" width="332" height="96" rx="12" fill="#090C14" stroke="#1E293B" stroke-width="1"/>
    <circle cx="104" cy="192" r="28" fill="#131A27" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="104" cy="192" r="8" fill="#EF4444"/>
    <path d="M144 192 L212 192" stroke="#D9FB76" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="224" y="170" width="128" height="44" rx="8" fill="#131A27" stroke="#D9FB76" stroke-width="1.5"/>
    <text x="240" y="190" fill="#D9FB76" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">CARTUCHO CG8+</text>
    <text x="240" y="204" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="9">Acción capilar 90°</text>

    <!-- Pasos claros -->
    <text x="40" y="264" fill="#F6F7FB" font-family="Inter, sans-serif" font-size="14" font-weight="700">Cómo tomar la muestra sin gravedad:</text>
    <text x="40" y="286" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="11">1. Sujeta tu mano al riel Velcro del módulo médico.</text>
    <text x="40" y="306" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="11">2. Limpia el anular con gasa estéril y espera 10 s a que evapore.</text>
    <text x="40" y="326" fill="#F6F7FB" font-family="Inter, sans-serif" font-size="11" font-weight="600">3. Acerca la tira a 90° (no sacudas el dedo).</text>
  </g>

  <!-- Advertencia de Modo de Fallo en Microgravedad -->
  <g id="FailureModeWarning">
    <rect x="24" y="364" width="364" height="74" rx="14" fill="#231B12" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="42" y="386" fill="#F59E0B" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">⚠ MODO DE FALLO EN MICROGRAVEDAD (0G)</text>
    <text x="42" y="406" fill="#F6F7FB" font-family="Inter, sans-serif" font-size="11">En 0G la gota no cae: forma una esfera por tensión superficial.</text>
    <text x="42" y="424" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="10.5">Si entra aire al canal capilar, la lectura dará un falso bajo (&lt;60 mg/dL).</text>
  </g>

  <!-- Entrada del Valor + Contexto Personal OSD-575 -->
  <g id="ValueInputPanel">
    <rect x="24" y="450" width="364" height="156" rx="18" fill="#131A27" stroke="#D9FB76" stroke-width="1.5"/>
    <text x="42" y="476" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="0.6">VALOR OBTENIDO EN LECTOR PORTÁTIL</text>

    <!-- Display numérico grande -->
    <rect x="42" y="490" width="204" height="64" rx="12" fill="#090C14" stroke="#334155" stroke-width="1.5"/>
    <text x="62" y="534" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="36" font-weight="700">103</text>
    <rect x="144" y="502" width="2" height="38" fill="#D9FB76"/>
    <text x="182" y="528" fill="#9BA4B8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600">mg/dL</text>

    <!-- Comparación inmediata con línea base C003 -->
    <rect x="258" y="490" width="112" height="64" rx="12" fill="#090C14" stroke="#1E293B" stroke-width="1"/>
    <text x="270" y="510" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="9" font-weight="600">TU BASE (C003)</text>
    <text x="270" y="530" fill="#10B981" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">71 mg/dL</text>
    <text x="270" y="545" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="8.5">Ref: 65–99 mg/dL</text>

    <!-- Condición de la toma -->
    <rect x="42" y="566" width="102" height="26" rx="8" fill="#D9FB76"/>
    <text x="56" y="583" fill="#11180A" font-family="Inter, sans-serif" font-size="10" font-weight="700">● En ayunas</text>
    <rect x="152" y="566" width="108" height="26" rx="8" fill="#090C14" stroke="#1E293B" stroke-width="1"/>
    <text x="166" y="583" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="10" font-weight="500">Post-prandial</text>
    <rect x="268" y="566" width="102" height="26" rx="8" fill="#090C14" stroke="#1E293B" stroke-width="1"/>
    <text x="282" y="583" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="10" font-weight="500">Post-EVA</text>
  </g>

  <!-- Teclado numérico táctil de guante / gran formato -->
  <g id="TouchKeypad">
    <rect x="24" y="618" width="84" height="44" rx="10" fill="#131A27"/><text x="61" y="646" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">1</text>
    <rect x="117" y="618" width="84" height="44" rx="10" fill="#131A27"/><text x="154" y="646" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">2</text>
    <rect x="210" y="618" width="84" height="44" rx="10" fill="#131A27"/><text x="247" y="646" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">3</text>
    <rect x="303" y="618" width="85" height="44" rx="10" fill="#1E293B"/><text x="336" y="646" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">⌫</text>

    <rect x="24" y="670" width="84" height="44" rx="10" fill="#131A27"/><text x="61" y="698" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">4</text>
    <rect x="117" y="670" width="84" height="44" rx="10" fill="#131A27"/><text x="154" y="698" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">5</text>
    <rect x="210" y="670" width="84" height="44" rx="10" fill="#131A27"/><text x="247" y="698" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">6</text>
    <rect x="303" y="670" width="85" height="44" rx="10" fill="#131A27"/><text x="340" y="698" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">0</text>

    <rect x="24" y="722" width="84" height="44" rx="10" fill="#131A27"/><text x="61" y="750" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">7</text>
    <rect x="117" y="722" width="84" height="44" rx="10" fill="#131A27"/><text x="154" y="750" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">8</text>
    <rect x="210" y="722" width="84" height="44" rx="10" fill="#131A27"/><text x="247" y="750" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">9</text>
    <rect x="303" y="722" width="85" height="44" rx="10" fill="#131A27"/><text x="341" y="750" fill="#F6F7FB" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">.</text>
  </g>

  <!-- CTA Evaluar contra Línea Base -->
  <rect x="24" y="780" width="364" height="52" rx="26" fill="#D9FB76"/>
  <text x="64" y="811" fill="#11180A" font-family="Inter, sans-serif" font-size="15" font-weight="700">Evaluar contra mi línea base →</text>

  <!-- Barra de Navegación Inferior -->
  <g id="BottomNav03">
    <rect x="24" y="842" width="364" height="42" rx="21" fill="#131A27" stroke="#1E293B" stroke-width="1"/>
    <text x="47" y="867" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="11" font-weight="500">Dashboard</text>
    <text x="142" y="867" fill="#9BA4B8" font-family="Inter, sans-serif" font-size="11" font-weight="500">Cuerpo 3D</text>
    <rect x="216" y="846" width="86" height="34" rx="17" fill="#1E293B"/>
    <text x="234" y="867" fill="#D9FB76" font-family="Inter, sans-serif" font-size="11" font-weight="700">Medición</text>
    <text x="312" y="867" fill="#FCA5A5" font-family="Inter, sans-serif" font-size="11" font-weight="600">Protocolos</text>
  </g>

  <text x="58" y="898" fill="#64748B" font-family="Inter, sans-serif" font-size="8.5" font-weight="500">Prototipo educativo NASA Space Apps 2026 · No es un dispositivo médico.</text>
  <rect x="142" y="906" width="128" height="4" rx="2" fill="#F6F7FB" fill-opacity="0.4"/>
</svg>
