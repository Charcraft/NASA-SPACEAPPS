<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEGIS · Dashboard &amp; Modelo 3D Minimalista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050608;
      --surface: #0A0B0E;
      --card: #101217;
      --border: #1C2029;
      --text: #ECEFF4;
      --muted: #7D8594;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(10, 11, 14, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title { font-size: 14px; font-weight: 500; color: var(--text); }
    .subtitle { font-size: 12px; color: var(--muted); margin-left: 12px; }
    .actions { display: flex; gap: 10px; align-items: center; }
    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    button:hover { border-color: #484F5C; }
    button.primary {
      background: var(--text);
      color: #0A0B0E;
      border-color: var(--text);
      font-weight: 600;
    }
    .tabs {
      display: flex;
      gap: 24px;
      padding: 14px 40px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .tab {
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      padding-bottom: 4px;
      border-bottom: 1.5px solid transparent;
    }
    .tab.active {
      color: var(--text);
      border-bottom-color: var(--text);
    }
    main { padding: 36px 40px; display: flex; flex-direction: column; align-items: center; gap: 48px; }
    .stage {
      width: 100%;
      max-width: 1440px;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }
    .stage svg { width: 100%; height: auto; display: block; }
    .grid-all {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(640px, 1fr));
      gap: 32px;
      width: 100%;
      max-width: 1440px;
    }
    .card-preview {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      cursor: pointer;
    }
    .card-preview-head {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .card-preview svg { width: 100%; height: auto; display: block; }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text);
      color: #0A0B0E;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div>
      <span class="title">AEGIS</span>
      <span class="subtitle">Diseño minimalista monocromático · Desktop 1440×900 · Modelo 3D central</span>
    </div>
    <div class="actions">
      <button onclick="copyCurrent()">Copiar vista actual (SVG)</button>
      <button class="primary" onclick="copyAll()">Copiar las 6 vistas para Figma (Ctrl+V)</button>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>

  <main>
    <div class="stage" id="mainStage"></div>
    <div class="grid-all" id="gridAll"></div>
  </main>

  <div class="toast" id="toast">Copiado al portapapeles</div>

  <script>
    const SCREENS = [{"file": "01-dashboard-rutina.svg", "title": "Dashboard principal + Modelo 3D", "desc": "Vista general minimalista con el modelo 3D en el centro y solo las métricas esenciales.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1440\" height=\"900\" viewBox=\"0 0 1440 900\" fill=\"none\">\n  <defs>\n    <radialGradient id=\"monoGlow\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n      <stop offset=\"0%\" stop-color=\"#ECEFF4\" stop-opacity=\"0.05\"/>\n      <stop offset=\"100%\" stop-color=\"#0A0B0E\" stop-opacity=\"0\"/>\n    </radialGradient>\n  </defs>\n  <rect width=\"1440\" height=\"900\" fill=\"#0A0B0E\"/>\n  \n  <!-- Barra superior minimalista -->\n  <g id=\"TopNav\">\n    <text x=\"56\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"14\" font-weight=\"600\" letter-spacing=\"0.4\">AEGIS</text>\n    <text x=\"112\" y=\"46\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Tripulante C001</text>\n\n    <!-- Navegación limpia sin cajas pesadas -->\n    <text x=\"540\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"500\">Vista general</text>\n    <text x=\"656\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Modelo 3D</text>\n    <text x=\"756\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Medición</text>\n    <text x=\"846\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Evaluación</text>\n\n    <!-- Estado offline discreto -->\n    <circle cx=\"1216\" cy=\"41\" r=\"3\" fill=\"#ECEFF4\"/>\n    <text x=\"1228\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\" font-weight=\"400\">Autónomo</text>\n\n    <rect x=\"1304\" y=\"28\" width=\"80\" height=\"28\" rx=\"14\" fill=\"#ECEFF4\"/>\n    <text x=\"1322\" y=\"46\" fill=\"#0A0B0E\" font-family=\"Inter, sans-serif\" font-size=\"11\" font-weight=\"600\">Rutina</text>\n\n    <line x1=\"56\" y1=\"72\" x2=\"1384\" y2=\"72\" stroke=\"#181B22\" stroke-width=\"1\"/>\n  </g>\n\n  \n  <!-- Escenario Central 3D (Malla Monocromática Limpia) -->\n  <g id=\"Viewport3D\">\n    <!-- Halo sutil monocromático -->\n    <circle cx=\"720\" cy=\"450\" r=\"250\" fill=\"url(#monoGlow)\"/>\n    <circle cx=\"720\" cy=\"450\" r=\"220\" stroke=\"#161920\" stroke-width=\"1\"/>\n    <circle cx=\"720\" cy=\"450\" r=\"150\" stroke=\"#14171E\" stroke-width=\"1\" stroke-dasharray=\"2 6\"/>\n\n    <!-- Eje vertical de referencia arquitectónica -->\n    <line x1=\"720\" y1=\"140\" x2=\"720\" y2=\"760\" stroke=\"#14171E\" stroke-width=\"1\"/>\n    <line x1=\"560\" y1=\"660\" x2=\"880\" y2=\"660\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <ellipse cx=\"720\" cy=\"660\" rx=\"110\" ry=\"22\" stroke=\"#1C2029\" stroke-width=\"1\" fill=\"none\"/>\n\n    <!-- Modelo 3D del Astronauta (Silueta volumétrica limpia por contornos) -->\n    <!-- Casco / Cabeza -->\n    <circle cx=\"720\" cy=\"246\" r=\"34\" fill=\"#0E1015\" stroke=\"#94A3B8\" stroke-width=\"1.5\"/>\n    <ellipse cx=\"720\" cy=\"246\" rx=\"24\" ry=\"18\" fill=\"#141820\" stroke=\"#484F5C\" stroke-width=\"1\"/>\n    <!-- Cuello y Hombros -->\n    <path d=\"M702 280 L738 280 L778 308 L662 308 Z\" fill=\"#0E1015\" stroke=\"#484F5C\" stroke-width=\"1.2\"/>\n    <!-- Torso Volumétrico -->\n    <path d=\"M662 308 L778 308 L764 468 L676 468 Z\" fill=\"#0E1015\" stroke=\"#94A3B8\" stroke-width=\"1.5\"/>\n    <!-- Líneas de topología 3D discretas en el torso -->\n    <path d=\"M670 355 Q720 368 770 355\" stroke=\"#1E232D\" stroke-width=\"1\" fill=\"none\"/>\n    <path d=\"M674 410 Q720 422 766 410\" stroke=\"#1E232D\" stroke-width=\"1\" fill=\"none\"/>\n    <line x1=\"720\" y1=\"280\" x2=\"720\" y2=\"468\" stroke=\"#1E232D\" stroke-width=\"1\"/>\n\n    <!-- Brazos -->\n    <path d=\"M662 308 L628 446 L652 452 L674 348\" fill=\"#0E1015\" stroke=\"#64748B\" stroke-width=\"1.2\"/>\n    <path d=\"M778 308 L812 446 L788 452 L766 348\" fill=\"#0E1015\" stroke=\"#64748B\" stroke-width=\"1.2\"/>\n\n    <!-- Piernas -->\n    <path d=\"M678 468 L668 648 L702 648 L712 468\" fill=\"#0E1015\" stroke=\"#64748B\" stroke-width=\"1.2\"/>\n    <path d=\"M728 468 L738 648 L772 648 L762 468\" fill=\"#0E1015\" stroke=\"#64748B\" stroke-width=\"1.2\"/>\n\n    <!-- Nodos anatómicos minimalistas -->\n    <!-- Neuro / Ocular -->\n    <circle cx=\"720\" cy=\"242\" r=\"4\" fill=\"#64748B\"/>\n    <!-- Cardiorrespiratorio -->\n    <circle cx=\"734\" cy=\"352\" r=\"4\" fill=\"#64748B\"/>\n    <!-- Metabólico (Único punto con atención suave) -->\n    <circle cx=\"708\" cy=\"418\" r=\"10\" fill=\"#ECEFF4\" fill-opacity=\"0.12\"/>\n    <circle cx=\"708\" cy=\"418\" r=\"4.5\" fill=\"#ECEFF4\"/>\n\n    <!-- Controles de cámara 3D discretos al pie del modelo -->\n    <rect x=\"610\" y=\"704\" width=\"220\" height=\"32\" rx=\"16\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"634\" y=\"724\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"11\" font-weight=\"500\">Frontal</text>\n    <text x=\"704\" y=\"724\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"11\">Lateral</text>\n    <text x=\"772\" y=\"724\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"11\">Capas</text>\n  </g>\n\n\n  <!-- Columna Izquierda: Estado General y 3 Signos Vitales Primarios (Sin saturación) -->\n  <g id=\"LeftColumn\">\n    <text x=\"56\" y=\"136\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\" font-weight=\"400\">Estado fisiológico</text>\n    <text x=\"56\" y=\"172\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"28\" font-weight=\"500\" letter-spacing=\"-0.5\">Estable, 1 variación leve</text>\n    <text x=\"56\" y=\"198\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Comparado contra tu línea base pre-vuelo (L-44)</text>\n\n    <line x1=\"56\" y1=\"232\" x2=\"380\" y2=\"232\" stroke=\"#181B22\" stroke-width=\"1\"/>\n\n    <!-- Métrica 1: Pulso -->\n    <text x=\"56\" y=\"272\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Frecuencia cardíaca</text>\n    <text x=\"56\" y=\"316\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"40\" font-weight=\"300\" letter-spacing=\"-1\">72</text>\n    <text x=\"110\" y=\"316\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"14\">lpm</text>\n    <text x=\"290\" y=\"312\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\">Base 68</text>\n\n    <line x1=\"56\" y1=\"352\" x2=\"380\" y2=\"352\" stroke=\"#181B22\" stroke-width=\"1\"/>\n\n    <!-- Métrica 2: Saturación -->\n    <text x=\"56\" y=\"392\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Saturación de oxígeno</text>\n    <text x=\"56\" y=\"436\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"40\" font-weight=\"300\" letter-spacing=\"-1\">98</text>\n    <text x=\"110\" y=\"436\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"14\">%</text>\n    <text x=\"290\" y=\"432\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\">Base 99%</text>\n\n    <line x1=\"56\" y1=\"472\" x2=\"380\" y2=\"472\" stroke=\"#181B22\" stroke-width=\"1\"/>\n\n    <!-- Métrica 3: Presión arterial -->\n    <text x=\"56\" y=\"512\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Presión arterial</text>\n    <text x=\"56\" y=\"556\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"40\" font-weight=\"300\" letter-spacing=\"-1\">118/76</text>\n    <text x=\"196\" y=\"556\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"14\">mmHg</text>\n    <text x=\"290\" y=\"552\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\">Nominal</text>\n\n    <line x1=\"56\" y1=\"592\" x2=\"380\" y2=\"592\" stroke=\"#181B22\" stroke-width=\"1\"/>\n\n    <!-- Selector minimalista de tripulación -->\n    <text x=\"56\" y=\"640\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"12\">Tripulación (OSD-575)</text>\n    <rect x=\"56\" y=\"658\" width=\"68\" height=\"36\" rx=\"8\" fill=\"#161922\" stroke=\"#ECEFF4\" stroke-width=\"1\"/>\n    <text x=\"75\" y=\"681\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"12\" font-weight=\"500\">C001</text>\n\n    <rect x=\"134\" y=\"658\" width=\"68\" height=\"36\" rx=\"8\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"153\" y=\"681\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\">C002</text>\n\n    <rect x=\"212\" y=\"658\" width=\"68\" height=\"36\" rx=\"8\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"231\" y=\"681\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\">C003</text>\n\n    <rect x=\"290\" y=\"658\" width=\"68\" height=\"36\" rx=\"8\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"309\" y=\"681\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\">C004</text>\n  </g>\n\n  <!-- Columna Derecha: Foco Único en la Variación Detectada + Tendencia Limpia -->\n  <g id=\"RightColumn\">\n    <rect x=\"1020\" y=\"128\" width=\"364\" height=\"320\" rx=\"16\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <circle cx=\"1050\" cy=\"162\" r=\"4\" fill=\"#ECEFF4\"/>\n    <text x=\"1064\" y=\"166\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"12\" font-weight=\"500\">Observación activa · Metabólico</text>\n\n    <text x=\"1048\" y=\"218\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"44\" font-weight=\"300\" letter-spacing=\"-1\">102</text>\n    <text x=\"1132\" y=\"218\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"15\">mg/dL</text>\n    <text x=\"1048\" y=\"244\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Glucosa en ayunas (+14% sobre tu base de 89 mg/dL) 4m 20s</text>\n  </g>\n\n  <!-- Pie de página silencioso -->\n  <text x=\"56\" y=\"860\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"11\">Prototipo informativo basado en NASA OSDR OSD-575. No es un dispositivo médico.</text>\n</svg>"}, {"file": "02-mapa-corporal.svg", "title": "Exploración del Modelo 3D", "desc": "Inspección limpia por sistema anatómico sin saturación visual.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1440\" height=\"900\" viewBox=\"0 0 1440 900\" fill=\"none\">\n  <defs>\n    <radialGradient id=\"monoGlow\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n      <stop offset=\"0%\" stop-color=\"#ECEFF4\" stop-opacity=\"0.06\"/>\n      <stop offset=\"100%\" stop-color=\"#0A0B0E\" stop-opacity=\"0\"/>\n    </radialGradient>\n  </defs>\n  <rect width=\"1440\" height=\"900\" fill=\"#0A0B0E\"/>\n  \n  <!-- Barra superior minimalista -->\n  <g id=\"TopNav\">\n    <text x=\"56\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"14\" font-weight=\"600\" letter-spacing=\"0.4\">AEGIS</text>\n    <text x=\"112\" y=\"46\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Tripulante C001</text>\n\n    <!-- Navegación limpia sin cajas pesadas -->\n    <text x=\"540\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Vista general</text>\n    <text x=\"656\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"500\">Modelo 3D</text>\n    <text x=\"756\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"500\">Medición</text>\n    <text x=\"846\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Evaluación</text>\n\n    <!-- Estado offline discreto -->\n    <circle cx=\"1216\" cy=\"41\" r=\"3\" fill=\"#ECEFF4\"/>\n    <text x=\"1228\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\" font-w "720\" y1=\"280\" x2=\"720\" y2=\"468\" stroke=\"#1E232D\" stroke-width=\"1\"/>\n\n    <!-- Brazos -->\n    <path d=\"M662 308 L628 446 L652 452 L674 348\" fill=\"#0E1015\" stroke=\"#64748B\" stroke-width=\"1.2\"/>\n    <path d=\"M778 308 L812 446 L788 452 L766 348\" fill=\"#0E1015\" stroke=\"#64748B\" stroke-width=\"1.2\"/>\n\n    <!-- Piernas -->\n    <path d=\"M678 468 L668 648 L702 648 L712 468\" fill=\"#0E1015\" stroke=\"#64748B\" stroke-width=\"1.2\"/>\n    <path d=\"M728 468 L738 648 L772 648 L762 468\" fill=\"#0E1015\" stroke=\"#64748B\" stroke-width=\"1.2\"/>\n\n    <!-- Nodos anatómicos minimalistas -->\n    <!-- Neuro / Ocular -->\n    <circle cx=\"720\" cy=\"242\" r=\"4\" fill=\"#ECEFF4\"/>\n    <!-- Cardiorrespiratorio -->\n    <circle cx=\"734\" cy=\"352\" r=\"4\" fill=\"#64748B\"/>\n    <!-- Metabólico (Único punto con atención suave) -->\n    <circle cx=\"708\" cy=\"418\" r=\"10\" fill=\"#ECEFF4\" fill-opacity=\"0.12\"/>\n    <circle cx=\"708\" cy=\"418\" r=\"4.5\" fill=\"#ECEFF4\"/>\n\n    <!-- Controles de cámara 3D discretos al pie del modelo -->\n    <rect x=\"610\" y=\"704\" width=\"220\" height=\"32\" rx=\"16\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"634\" y=\"724\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"11\" font-weight=\"500\">Frontal</text>\n    <text x=\"704\" y=\"724\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"11\">Lateral</text>\n    <text x=\"772\" y=\"724\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"11\">Capas</text>\n  </g>\n\n\n  <!-- Línea conectora sutil del nodo craneal a la ficha derecha -->\n  <line x1=\"724\" y1=\"242\" x2=\"1020\" y2=\"242\" stroke=\"#484F5C\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n\n  <!-- Izquierda: Índice limpio de los 5 sistemas (sin cajas saturadas) -->\n  <g id=\"SystemsList\">\n    <text x=\"56\" y=\"136\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"12\">Sistemas corporales</text>\n\n    <text x=\"56\" y=\"192\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"18\" font-weight=\"500\">Neuro-ocular (SANS)</text>\n    <text x=\"56\" y=\"214\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\">Adaptación a microgravedad</text>\n    <line x1=\"56\" y1=\"238\" x2=\"340\" y2=\"238\" stroke=\"#ECEFF4\" stroke-width=\"1\"/>\n\n    <text x=\"56\" y=\"286\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"16\">Cardiovascular</text>\n    <text x=\"280\" y=\"286\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"12\">Nominal</text>\n    <line x1=\"56\" y1=\"312\" x2=\"340\" y2=\"312\" stroke=\"#181B22\" stroke-width=\"1\"/>\n\n    <text x=\"56\" y=\"360\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"16\">Respiratorio</text>\n    <text x=\"280\" y=\"360\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"12\">Nominal</text>\n    <line x1=\"56\" y1=\"386\" x2=\"340\" y2=\"386\" stroke=\"#181B22\" stroke-width=\"1\"/>\n\n    <text x=\"56\" y=\"434\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"16\">Metabólico y hepático</text>\n    <text x=\"272\" y=\"434\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"12\">1 aviso</text>\n    <line x1=\"56\" y1=\"460\" x2=\"340\" y2=\"460\" stroke=\"#181B22\" stroke-width=\"1\"/>\n\n    <text x=\"56\" y=\"508\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"16\">Musculoesquelético</text>\n    <text x=\"280\" y=\"508\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"12\">Nominal</text>\n    <line x1=\"56\" y1=\"534\" x2=\"340\" y2=\"534\" stroke=\"#181B22\" stroke-width=\"1\"/>\n  </g>\n\n  <!-- Derecha: Detalle limpio del nodo seleccionado en el Modelo 3D -->\n  <g id=\"NodeDetail\">\n    <rect x=\"1020\" y=\"160\" width=\"364\" height=\"390\" rx=\"16\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"1052\" y=\"204\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\">Región seleccionada</text>\n    <text x=\"1052\" y=\"236\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"22\" font-weight=\"500\">Sistema Neuro-ocular</text>\n    <text x=\"1052\" y=\"266\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">El desplazamiento cefálico de fluidos en 0G incrementa</text>\n    <text x=\"1052\" y=\"286\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">la presión intracraneal y aplana el globo ocular.</text>\n\n    <line x1=\"1052\" y1=\"316\" x2=\"1352\" y2=\"316\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n\n    <text x=\"1052\" y=\"352\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Agudeza visual cercana</text>\n    <text x=\"1296\" y=\"352\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\">20/20</text>\n\n    <text x=\"1052\" y=\"392\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Rejilla de Amsler</text>\n    <text x=\"1248\" y=\"392\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\">Sin distorsión</text>\n\n    <text x=\"1052\" y=\"432\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Calidad de sueño</text>\n    <text x=\"1304\" y=\"432\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\">6.8 h</text>\n\n    <rect x=\"1052\" y=\"476\" width=\"300\" height=\"44\" rx=\"10\" fill=\"#161922\" stroke=\"#262B36\" stroke-width=\"1\"/>\n    <text x=\"1126\" y=\"503\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"500\">Evaluar este sistema</text>\n  </g>\n\n  <text x=\"56\" y=\"860\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"11\">Prototipo informativo basado en NASA OSDR OSD-575. No es un dispositivo médico.</text>\n</svg>"}, {"file": "03-asistente-medicion.svg", "title": "Medición guiada en 0G", "desc": "Instrucción paso a paso con amplio espacio negativo y lectura clara.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1440\" height=\"900\" viewBox=\"0 0 1440 900\" fill=\"none\">\n  <rect width=\"1440\" height=\"900\" fill=\"#0A0B0E\"/>\n  \n  <!-- Barra superior minimalista -->\n  <g id=\"TopNav\">\n    <text x=\"56\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"14\" font-weight=\"600\" letter-spacing=\"0.4\">AEGIS</text>\n    <text x=\"112\" y=\"46\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Tripulante C001</text>\n\n    <!-- Navegación limpia sin cajas pesadas -->\n    <text x=\"540\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Vista general</text>\n    <text x=\"656\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Modelo 3D</text>\n    <text x=\"756\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Medición</text>\n    <text x=\"846\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Evaluación</text>\n\n    <!-- Estado offline discreto -->\n    <circle cx=\"1216\" cy=\"41\" r=\"3\" fill=\"#ECEFF4\"/>\n    <text x=\"1228\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\" font-weight=\"400\">Autónomo</text>\n\n    <rect x=\"1304\" y=\"28\" width=\"80\" height=\"28\" rx=\"14\" fill=\"#ECEFF4\"/>\n    <text x=\"1322\" y=\"46\" fill=\"#0A0B0E\" font-family=\"Inter, sans-serif\" font-size=\"11\" font-weight=\"600\">Rutina</text>\n\n    <line x1=\"56\" y1=\"72\" x2=\"1384\" y2=\"72\" stroke=\"#181B22\" stroke-width=\"1\"/>\n  </g>\n\n\n  <!-- Diseño editorial de 2 columnas con amplio espacio en blanco -->\n  <g id=\"GuidedStepLeft\">\n    <text x=\"140\" y=\"168\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Paso 2 de 3 · Toma capilar en microgravedad</text>\n    <text x=\"140\" y=\"218\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"34\" font-weight=\"400\" letter-spacing=\"-0.6\">Acerca el cartucho a 90°</text>\n    <text x=\"140\" y=\"260\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"34\" font-weight=\"400\" letter-spacing=\"-0.6\">de la esfera de sangre</text>\n\n    <text x=\"140\" y=\"320\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"15\">En microgravedad la gota no cae: permanece adherida al dedo</text>\n    <text x=\"140\" y=\"344\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"15\">por tensión superficial. No sacudas la mano.</text>\n\n    <!-- Nota de modo de fallo sobria y limpia -->\n    <rect x=\"140\" y=\"396\" width=\"460\" height=\"96\" rx=\"12\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"168\" y=\"430\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"500\">Evita burbujas en el canal capilar</text>\n    <text x=\"168\" y=\"456\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">La entrada de aire produce lecturas falsamente bajas (&lt;60 mg/dL).</text>\n  </g>\n\n  <!-- Derecha: Ingreso limpio del valor -->\n  <g id=\"GuidedInputRight\">\n    <rect x=\"760\" y=\"168\" width=\"520\" height=\"480\" rx=\"20\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"816\" y=\"226\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Lectura del analizador portátil (Glucosa)</text>\n\n    <text x=\"816\" y=\"330\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"76\" font-weight=\"300\" letter-spacing=\"-2\">102</text>\n    <text x=\"970\" y=\"330\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"22\">mg/dL</text>\n\n    <line x1=\"816\" y1=\"368\" x2=\"1224\" y2=\"368\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n\n    <text x=\"816\" y=\"412\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Tu media pre-vuelo (C001)</text>\n    <text x=\"1140\" y=\"412\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\">89 mg/dL</text>\n\n    <text x=\"816\" y=\"452\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Rango de referencia (OSD-575)</text>\n    <text x=\"1120\" y=\"452\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">65 – 99 mg/dL</text>\n\n    <rect x=\"816\" y=\"536\" width=\"408\" height=\"52\" rx=\"12\" fill=\"#ECEFF4\"/>\n    <text x=\"938\" y=\"567\" fill=\"#0A0B0E\" font-family=\"Inter, sans-serif\" font-size=\"14\" font-weight=\"600\">Evaluar lectura</text>\n  </g>\n\n  <text x=\"56\" y=\"860\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"11\">Prototipo informativo basado en NASA OSDR OSD-575. No es un dispositivo médico.</text>\n</svg>"}, {"file": "04-tarjeta-triage.svg", "title": "Evaluación contra línea base", "desc": "Explicación directa del desvío personal y pasos recomendados.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1440\" height=\"900\" viewBox=\"0 0 1440 900\" fill=\"none\">\n  <rect width=\"1440\" height=\"900\" fill=\"#0A0B0E\"/>\n  \n  <!-- Barra superior minimalista -->\n  <g id=\"TopNav\">\n    <text x=\"56\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"14\" font-weight=\"600\" letter-spacing=\"0.4\">AEGIS</text>\n    <text x=\"112\" y=\"46\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Tripulante C001</text>\n\n    <!-- Navegación limpia sin cajas pesadas -->\n    <text x=\"540\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Vista general</text>\n    <text x=\"656\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Modelo 3D</text>\n    <text x=\"756\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Medición</text>\n    <text x=\"846\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"500\">Evaluación</text>\n\n    <!-- Estado offline discreto -->\n    <circle cx=\"1216\" cy=\"41\" r=\"3\" fill=\"#ECEFF4\"/>\n    <text x=\"1228\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\" font-weight=\"400\">Autónomo</text>\n\n    <rect x=\"1304\" y=\"28\" width=\"80\" height=\"28\" rx=\"14\" fill=\"#ECEFF4\"/>\n    <text x=\"1322\" y=\"46\" fill=\"#0A0B0E\" font-family=\"Inter, sans-serif\" font-size=\"11\" font-weight=\"600\">Rutina</text>\n\n    <line x1=\"56\" y1=\"72\" x2=\"1384\" y2=\"72\" stroke=\"#181B22\" stroke-width=\"1\"/>\n  </g>\n\n\n  <!-- Resultado centrado, sereno y directo -->\n  <g id=\"EvaluationClean\">\n    <text x=\"140\" y=\"168\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Resultado de evaluación · C001</text>\n    <text x=\"140\" y=\"220\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"36\" font-weight=\"400\" letter-spacing=\"-0.6\">Atención moderada</text>\n    <text x=\"140\" y=\"264\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"16\">102 mg/dL supera el límite superior de referencia (99 mg/dL)</text>\n    <text x=\"140\" y=\"290\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"16\">y se desvía +14.6% respecto a tu línea base personal.</text>\n\n    <line x1=\"140\" y1=\"340\" x2=\"640\" y2=\"340\" stroke=\"#181B22\" stroke-width=\"1\"/>\n\n    <text x=\"140\" y=\"388\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"15\" font-weight=\"500\">Pasos recomendados</text>\n    <text x=\"140\" y=\"430\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"15\">1. Hidratación oral con 250 mL de agua para descartar hemoconcentración.</text>\n    <text x=\"140\" y=\"468\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"15\">2. Repetir la medición capilar en 120 minutos.</text>\n    <text x=\"140\" y=\"506\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"15\">3. Si aparece dolor torácico, mareo o visión borrosa, cambiar a protocolo agudo.</text>\n\n    <rect x=\"140\" y=\"568\" width=\"240\" height=\"48\" rx=\"10\" fill=\"#ECEFF4\"/>\n    <text x=\"188\" y=\"597\" fill=\"#0A0B0E\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"600\">Programar recordatorio</text>\n\n    <rect x=\"396\" y=\"568\" width=\"220\" height=\"48\" rx=\"10\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"446\" y=\"597\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\">Reportar síntomas</text>\n  </g>\n\n  <!-- Derecha: Registro diferido para Tierra -->\n  <g id=\"DeferredSyncCard\">\n    <rect x=\"820\" y=\"168\" width=\"460\" height=\"280\" rx=\"16\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"860\" y=\"216\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"15\" font-weight=\"500\">Sincronización diferida con Tierra</text>\n    <text x=\"860\" y=\"250\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">La lectura quedó almacenada localmente y se enviará</text>\n    <text x=\"860\" y=\"272\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">al Flight Surgeon en la próxima ventana disponible.</text>\n\n    <line x1=\"860\" y1=\"312\" x2=\"1240\" y2=\"312\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"860\" y=\"348\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"12\">Fuente de referencia</text>\n    <text x=\"860\" y=\"372\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">NASA OSDR OSD-575 · Inspiration4 CMP</text>\n  </g>\n\n  <text x=\"56\" y=\"860\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"11\">Prototipo informativo basado en NASA OSDR OSD-575. No es un dispositivo médico. No diagnostica ni prescribe.</text>\n</svg>"}, {"file": "05-selector-emergencia.svg", "title": "Selector de emergencia", "desc": "Cuatro protocolos críticos de acceso inmediato sin ruido visual.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1440\" height=\"900\" viewBox=\"0 0 1440 900\" fill=\"none\">\n  <rect width=\"1440\" height=\"900\" fill=\"#0A0B0E\"/>\n  \n  <!-- Barra superior minimalista -->\n  <g id=\"TopNav\">\n    <text x=\"56\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"14\" font-weight=\"600\" letter-spacing=\"0.4\">AEGIS</text>\n    <text x=\"112\" y=\"46\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Tripulante C001</text>\n\n    <!-- Navegación limpia sin cajas pesadas -->\n    <text x=\"540\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"500\">Vista general</text>\n    <text x=\"656\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Modelo 3D</text>\n    <text x=\"756\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Medición</text>\n    <text x=\"846\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Evaluación</text>\n\n    <!-- Estado offline discreto -->\n    <circle cx=\"1216\" cy=\"41\" r=\"3\" fill=\"#ECEFF4\"/>\n    <text x=\"1228\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\" font-weight=\"400\">Autónomo</text>\n\n    <rect x=\"1304\" y=\"28\" width=\"80\" height=\"28\" rx=\"14\" fill=\"#E5484D\"/>\n    <text x=\"1322\" y=\"46\" fill=\"#0A0B0E\" font-family=\"Inter, sans-serif\" font-size=\"11\" font-weight=\"600\">Emergencia</text>\n\n    <line x1=\"56\" y1=\"72\" x2=\"1384\" y2=\"72\" stroke=\"#181B22\" stroke-width=\"1\"/>\n  </g>\n\n\n  <text x=\"140\" y=\"168\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Respuesta autónoma sin enlace a Tierra</text>\n  <text x=\"140\" y=\"216\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"34\" font-weight=\"400\" letter-spacing=\"-0.6\">Selecciona el evento clínico</text>\n\n  <!-- Grid minimalista 2x2 de protocolos -->\n  <g id=\"EmergencyGrid\">\n    <!-- Card 1: Cardiovascular (Escenario AEB) -->\n    <rect x=\"140\" y=\"272\" width=\"556\" height=\"210\" rx=\"16\" fill=\"#101217\" stroke=\"#ECEFF4\" stroke-width=\"1.2\"/>\n    <text x=\"180\" y=\"320\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"12\" font-weight=\"500\">Prioridad inmediata</text>\n    <text x=\"180\" y=\"362\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"24\" font-weight=\"500\">Dolor torácico o colapso</text>\n    <text x=\"180\" y=\"394\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"14\">Opresión aguda, síncope, arritmia o paro cardiorrespiratorio.</text>\n    <text x=\"180\" y=\"444\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"500\">Abrir protocolo cardiovascular</text>\n\n    <!-- Card 2: Hipoxia / CO2 -->\n    <rect x=\"724\" y=\"272\" width=\"556\" height=\"210\" rx=\"16\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"764\" y=\"320\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\">Ambiental y respiratorio</text>\n    <text x=\"764\" y=\"362\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"24\" font-weight=\"400\">Hipoxia o exceso de CO₂</text>\n    <text x=\"764\" y=\"394\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"14\">Disnea aguda, SpO₂ menor a 90% o cefalea por hipercapnia.</text>\n    <text x=\"764\" y=\"444\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Abrir protocolo respiratorio</text>\n\n    <!-- Card 3: Neuro-ocular agudo -->\n    <rect x=\"140\" y=\"510\" width=\"556\" height=\"210\" rx=\"16\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"180\" y=\"558\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\">Neurológico</text>\n    <text x=\"180\" y=\"600\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"24\" font-weight=\"400\">Alteración visual o vértigo</text>\n    <text x=\"180\" y=\"632\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"14\">Pérdida visual súbita, presión intracraneal o desorientación.</text>\n    <text x=\"180\" y=\"682\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Abrir protocolo neurológico</text>\n\n    <!-- Card 4: Trauma / EVA -->\n    <rect x=\"724\" y=\"510\" width=\"556\" height=\"210\" rx=\"16\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"764\" y=\"558\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\">Trauma y actividad extravehicular</text>\n    <text x=\"764\" y=\"600\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"24\" font-weight=\"400\">Hemorragia o lesión en EVA</text>\n    <text x=\"764\" y=\"632\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"14\">Fijación en camilla CMRS, control de sangrado y descontaminación.</text>\n    <text x=\"764\" y=\"682\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Abrir protocolo de trauma</text>\n  </g>\n\n  <text x=\"56\" y=\"860\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"11\">Basado en ISS Medical Checklist (JSC-48522). No es un dispositivo médico.</text>\n</svg>"}, {"file": "06-protocolo-activo.svg", "title": "Protocolo activo y RCP 0G", "desc": "Una sola acción en foco con metrónomo a 110 lpm y registro automático.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1440\" height=\"900\" viewBox=\"0 0 1440 900\" fill=\"none\">\n  <rect width=\"1440\" height=\"900\" fill=\"#0A0B0E\"/>\n  \n  <!-- Barra superior minimalista -->\n  <g id=\"TopNav\">\n    <text x=\"56\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"14\" font-weight=\"600\" letter-spacing=\"0.4\">AEGIS</text>\n    <text x=\"112\" y=\"46\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Tripulante C001</text>\n\n    <!-- Navegación limpia sin cajas pesadas -->\n    <text x=\"540\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"500\">Vista general</text>\n    <text x=\"656\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Modelo 3D</text>\n    <text x=\"756\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Medición</text>\n    <text x=\"846\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Evaluación</text>\n\n    <!-- Estado offline discreto -->\n    <circle cx=\"1216\" cy=\"41\" r=\"3\" fill=\"#ECEFF4\"/>\n    <text x=\"1228\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\" font-weight=\"400\">Autónomo</text>\n\n    <rect x=\"1304\" y=\"28\" width=\"80\" height=\"28\" rx=\"14\" fill=\"#E5484D\"/>\n    <text x=\"1322\" y=\"46\" fill=\"#0A0B0E\" font-family=\"Inter, sans-serif\" font-size=\"11\" font-weight=\"600\">Emergencia</text>\n\n    <line x1=\"56\" y1=\"72\" x2=\"1384\" y2=\"72\" stroke=\"#181B22\" stroke-width=\"1\"/>\n  </g>\n\n\n  <!-- Izquierda: Una sola instrucción clara y grande -->\n  <g id=\"ActiveProtocolFocus\">\n    <text x=\"140\" y=\"168\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Protocolo cardiovascular · Paso 2 de 5 · Tiempo activo 02:18</text>\n    <text x=\"140\" y=\"226\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"40\" font-weight=\"400\" letter-spacing=\"-0.8\">Fija al paciente antes de</text>\n    <text x=\"140\" y=\"276\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"40\" font-weight=\"400\" letter-spacing=\"-0.8\">iniciar las compresiones</text>\n\n    <text x=\"140\" y=\"344\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"16\">Sin sujeción a la camilla CMRS o apoyo de pies en la pared opuesta</text>\n    <text x=\"140\" y=\"370\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"16\">(postura Handstand), la fuerza de compresión desplaza al rescatista.</text>\n\n    <!-- Metrónomo limpio -->\n    <rect x=\"140\" y=\"424\" width=\"520\" height=\"104\" rx=\"14\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <circle cx=\"184\" cy=\"476\" r=\"8\" fill=\"#ECEFF4\"/>\n    <text x=\"212\" y=\"468\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"22\" font-weight=\"400\">110 compresiones / min</text>\n    <text x=\"212\" y=\"496\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Profundidad de 5 a 6 cm · Relación 30:2 · DEA en Rack B2</text>\n\n    <!-- Botones de avance -->\n    <rect x=\"140\" y=\"568\" width=\"250\" height=\"52\" rx=\"12\" fill=\"#ECEFF4\"/>\n    <text x=\"196\" y=\"599\" fill=\"#0A0B0E\" font-family=\"Inter, sans-serif\" font-size=\"14\" font-weight=\"600\">Siguiente paso</text>\n\n    <rect x=\"410\" y=\"568\" width=\"250\" height=\"52\" rx=\"12\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"466\" y=\"599\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"14\">Registrar descarga DEA</text>\n  </g>\n\n  <!-- Derecha: Bitácora silenciosa para el Flight Surgeon -->\n  <g id=\"QuietLog\">\n    <rect x=\"820\" y=\"168\" width=\"460\" height=\"452\" rx=\"16\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"860\" y=\"218\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"14\" font-weight=\"500\">Registro automático para Flight Surgeon</text>\n    <line x1=\"860\" y1=\"242\" x2=\"1240\" y2=\"242\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n\n    <text x=\"860\" y=\"284\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">14:24:02   Inicio de protocolo cardiovascular (C001)</text>\n    <text x=\"860\" y=\"324\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">14:24:45   Vía aérea verificada y suministro O₂</text>\n    <text x=\"860\" y=\"364\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\">14:25:12   Fijación CMRS y metrónomo 110 lpm activo</text>\n\n    <rect x=\"860\" y=\"536\" width=\"380\" height=\"44\" rx=\"10\" fill=\"#161922\" stroke=\"#262B36\" stroke-width=\"1\"/>\n    <text x=\"954\" y=\"563\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\">Exportar paquete de telemetría</text>\n  </g>\n\n  <text x=\"56\" y=\"860\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"11\">Prototipo informativo basado en Hinkelbein et al. (RCP 0G) e ISS Medical Checklist. No es un dispositivo médico.</text>\n</svg>"}];
    const FULL_SVG = "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"3240\" height=\"3220\" viewBox=\"0 0 3240 3220\" fill=\"none\">\n  <rect width=\"3240\" height=\"3220\" fill=\"#050608\"/>\n  <text x=\"120\" y=\"84\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"24\" font-weight=\"500\">AEGIS · Sistema de Diseño Minimalista Monocromático (Desktop 1440×900)</text>\n  <g id=\"Desktop_01\" transform=\"translate(120, 160)\">\n    <text x=\"0\" y=\"-20\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"16\">Dashboard principal + Modelo 3D</text>\n\n  <defs>\n    <radialGradient id=\"monoGlow\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n      <stop offset=\"0%\" stop-color=\"#ECEFF4\" stop-opacity=\"0.05\"/>\n      <stop offset=\"100%\" stop-color=\"#0A0B0E\" stop-opacity=\"0\"/>\n    </radialGradient>\n  </defs>\n  <rect width=\"1440\" height=\"900\" fill=\"#0A0B0E\"/>\n  \n  <!-- Barra superior minimalista -->\n  <g id=\"TopNav\">\n    <text x=\"56\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"14\" font-weight=\"600\" letter-spacing=\"0.4\">AEGIS</text>\n    <text x=\"112\" y=\"46\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Tripulante C001</text>\n\n    <!-- Navegación limpia sin cajas pesadas -->\n    <text x=\"540\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"500\">Vista general</text>\n    <text x=\"656\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Modelo 3D</text>\n    <text x=\"756\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Medición</text>\n    <text x=\"846\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Evaluación</text>\n\n    <!-- Estado offline discreto -->\n    <circle cx=\"1216\" cy=\"41\" r=\"3\" fill=\"#ECEFF4\"/>\n    <text x=\"1228\" y=\"46\" fill=\"# cciona el evento clínico</text>\n\n  <!-- Grid minimalista 2x2 de protocolos -->\n  <g id=\"EmergencyGrid\">\n    <!-- Card 1: Cardiovascular (Escenario AEB) -->\n    <rect x=\"140\" y=\"272\" width=\"556\" height=\"210\" rx=\"16\" fill=\"#101217\" stroke=\"#ECEFF4\" stroke-width=\"1.2\"/>\n    <text x=\"180\" y=\"320\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"12\" font-weight=\"500\">Prioridad inmediata</text>\n    <text x=\"180\" y=\"362\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"24\" font-weight=\"500\">Dolor torácico o colapso</text>\n    <text x=\"180\" y=\"394\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"14\">Opresión aguda, síncope, arritmia o paro cardiorrespiratorio.</text>\n    <text x=\"180\" y=\"444\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"500\">Abrir protocolo cardiovascular</text>\n\n    <!-- Card 2: Hipoxia / CO2 -->\n    <rect x=\"724\" y=\"272\" width=\"556\" height=\"210\" rx=\"16\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"764\" y=\"320\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\">Ambiental y respiratorio</text>\n    <text x=\"764\" y=\"362\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"24\" font-weight=\"400\">Hipoxia o exceso de CO₂</text>\n    <text x=\"764\" y=\"394\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"14\">Disnea aguda, SpO₂ menor a 90% o cefalea por hipercapnia.</text>\n    <text x=\"764\" y=\"444\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Abrir protocolo respiratorio</text>\n\n    <!-- Card 3: Neuro-ocular agudo -->\n    <rect x=\"140\" y=\"510\" width=\"556\" height=\"210\" rx=\"16\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"180\" y=\"558\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\">Neurológico</text>\n    <text x=\"180\" y=\"600\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"24\" font-weight=\"400\">Alteración visual o vértigo</text>\n    <text x=\"180\" y=\"632\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"14\">Pérdida visual súbita, presión intracraneal o desorientación.</text>\n    <text x=\"180\" y=\"682\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Abrir protocolo neurológico</text>\n\n    <!-- Card 4: Trauma / EVA -->\n    <rect x=\"724\" y=\"510\" width=\"556\" height=\"210\" rx=\"16\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"764\" y=\"558\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\">Trauma y actividad extravehicular</text>\n    <text x=\"764\" y=\"600\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"24\" font-weight=\"400\">Hemorragia o lesión en EVA</text>\n    <text x=\"764\" y=\"632\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"14\">Fijación en camilla CMRS, control de sangrado y descontaminación.</text>\n    <text x=\"764\" y=\"682\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Abrir protocolo de trauma</text>\n  </g>\n\n  <text x=\"56\" y=\"860\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"11\">Basado en ISS Medical Checklist (JSC-48522). No es un dispositivo médico.</text>\n\n  </g>\n  <g id=\"Desktop_06\" transform=\"translate(1680, 2200)\">\n    <text x=\"0\" y=\"-20\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"16\">Protocolo activo y RCP 0G</text>\n\n  <rect width=\"1440\" height=\"900\" fill=\"#0A0B0E\"/>\n  \n  <!-- Barra superior minimalista -->\n  <g id=\"TopNav\">\n    <text x=\"56\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"14\" font-weight=\"600\" letter-spacing=\"0.4\">AEGIS</text>\n    <text x=\"112\" y=\"46\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Tripulante C001</text>\n\n    <!-- Navegación limpia sin cajas pesadas -->\n    <text x=\"540\" y=\"46\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"500\">Vista general</text>\n    <text x=\"656\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Modelo 3D</text>\n    <text x=\"756\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Medición</text>\n    <text x=\"846\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\" font-weight=\"400\">Evaluación</text>\n\n    <!-- Estado offline discreto -->\n    <circle cx=\"1216\" cy=\"41\" r=\"3\" fill=\"#ECEFF4\"/>\n    <text x=\"1228\" y=\"46\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"12\" font-weight=\"400\">Autónomo</text>\n\n    <rect x=\"1304\" y=\"28\" width=\"80\" height=\"28\" rx=\"14\" fill=\"#E5484D\"/>\n    <text x=\"1322\" y=\"46\" fill=\"#0A0B0E\" font-family=\"Inter, sans-serif\" font-size=\"11\" font-weight=\"600\">Emergencia</text>\n\n    <line x1=\"56\" y1=\"72\" x2=\"1384\" y2=\"72\" stroke=\"#181B22\" stroke-width=\"1\"/>\n  </g>\n\n\n  <!-- Izquierda: Una sola instrucción clara y grande -->\n  <g id=\"ActiveProtocolFocus\">\n    <text x=\"140\" y=\"168\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Protocolo cardiovascular · Paso 2 de 5 · Tiempo activo 02:18</text>\n    <text x=\"140\" y=\"226\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"40\" font-weight=\"400\" letter-spacing=\"-0.8\">Fija al paciente antes de</text>\n    <text x=\"140\" y=\"276\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"40\" font-weight=\"400\" letter-spacing=\"-0.8\">iniciar las compresiones</text>\n\n    <text x=\"140\" y=\"344\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"16\">Sin sujeción a la camilla CMRS o apoyo de pies en la pared opuesta</text>\n    <text x=\"140\" y=\"370\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"16\">(postura Handstand), la fuerza de compresión desplaza al rescatista.</text>\n\n    <!-- Metrónomo limpio -->\n    <rect x=\"140\" y=\"424\" width=\"520\" height=\"104\" rx=\"14\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <circle cx=\"184\" cy=\"476\" r=\"8\" fill=\"#ECEFF4\"/>\n    <text x=\"212\" y=\"468\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"22\" font-weight=\"400\">110 compresiones / min</text>\n    <text x=\"212\" y=\"496\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">Profundidad de 5 a 6 cm · Relación 30:2 · DEA en Rack B2</text>\n\n    <!-- Botones de avance -->\n    <rect x=\"140\" y=\"568\" width=\"250\" height=\"52\" rx=\"12\" fill=\"#ECEFF4\"/>\n    <text x=\"196\" y=\"599\" fill=\"#0A0B0E\" font-family=\"Inter, sans-serif\" font-size=\"14\" font-weight=\"600\">Siguiente paso</text>\n\n    <rect x=\"410\" y=\"568\" width=\"250\" height=\"52\" rx=\"12\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"466\" y=\"599\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"14\">Registrar descarga DEA</text>\n  </g>\n\n  <!-- Derecha: Bitácora silenciosa para el Flight Surgeon -->\n  <g id=\"QuietLog\">\n    <rect x=\"820\" y=\"168\" width=\"460\" height=\"452\" rx=\"16\" fill=\"#101217\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n    <text x=\"860\" y=\"218\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"14\" font-weight=\"500\">Registro automático para Flight Surgeon</text>\n    <line x1=\"860\" y1=\"242\" x2=\"1240\" y2=\"242\" stroke=\"#1C2029\" stroke-width=\"1\"/>\n\n    <text x=\"860\" y=\"284\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">14:24:02   Inicio de protocolo cardiovascular (C001)</text>\n    <text x=\"860\" y=\"324\" fill=\"#7D8594\" font-family=\"Inter, sans-serif\" font-size=\"13\">14:24:45   Vía aérea verificada y suministro O₂</text>\n    <text x=\"860\" y=\"364\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\">14:25:12   Fijación CMRS y metrónomo 110 lpm activo</text>\n\n    <rect x=\"860\" y=\"536\" width=\"380\" height=\"44\" rx=\"10\" fill=\"#161922\" stroke=\"#262B36\" stroke-width=\"1\"/>\n    <text x=\"954\" y=\"563\" fill=\"#ECEFF4\" font-family=\"Inter, sans-serif\" font-size=\"13\">Exportar paquete de telemetría</text>\n  </g>\n\n  <text x=\"56\" y=\"860\" fill=\"#484F5C\" font-family=\"Inter, sans-serif\" font-size=\"11\">Prototipo informativo basado en Hinkelbein et al. (RCP 0G) e ISS Medical Checklist. No es un dispositivo médico.</text>\n\n  </g>\n</svg>";
    let idx = 0;

    function render() {
      const tabs = document.getElementById('tabs');
      tabs.innerHTML = '';
      SCREENS.forEach((s, i) => {
        const el = document.createElement('div');
        el.className = 'tab' + (i === idx ? ' active' : '');
        el.textContent = s.title;
        el.onclick = () => { idx = i; render(); window.scrollTo({top: 0, behavior: 'smooth'}); };
        tabs.appendChild(el);
      });
      document.getElementById('mainStage').innerHTML = SCREENS[idx].svg;

      const grid = document.getElementById('gridAll');
      grid.innerHTML = '';
      SCREENS.forEach((s, i) => {
        const c = document.createElement('div');
        c.className = 'card-preview';
        c.innerHTML = `<div class="card-preview-head"><span>${s.title}</span><button onclick="event.stopPropagation(); copyOne(${i})">Copiar SVG</button></div>` + s.svg;
        c.onclick = () => { idx = i; render(); window.scrollTo({top: 0, behavior: 'smooth'}); };
        grid.appendChild(c);
      });
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function copyOne(i) {
      navigator.clipboard.writeText(SCREENS[i].svg);
      toast(`Vista copiada: ${SCREENS[i].title}`);
    }

    function copyCurrent() { copyOne(idx); }
    function copyAll() {
      navigator.clipboard.writeText(FULL_SVG);
      toast('6 vistas Desktop copiadas. Presiona Ctrl+V en Figma.');
    }

    render();
  </script>
