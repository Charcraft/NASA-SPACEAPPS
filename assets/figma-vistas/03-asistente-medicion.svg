<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <rect width="1440" height="900" fill="#0A0B0E"/>
  
  <!-- Barra superior minimalista -->
  <g id="TopNav">
    <text x="56" y="46" fill="#ECEFF4" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing="0.4">AEGIS</text>
    <text x="112" y="46" fill="#484F5C" font-family="Inter, sans-serif" font-size="13" font-weight="400">Tripulante C001</text>

    <!-- Navegación limpia sin cajas pesadas -->
    <text x="540" y="46" fill="#7D8594" font-family="Inter, sans-serif" font-size="13" font-weight="400">Vista general</text>
    <text x="656" y="46" fill="#7D8594" font-family="Inter, sans-serif" font-size="13" font-weight="400">Modelo 3D</text>
    <text x="756" y="46" fill="#ECEFF4" font-family="Inter, sans-serif" font-size="13" font-weight="400">Medición</text>
    <text x="846" y="46" fill="#7D8594" font-family="Inter, sans-serif" font-size="13" font-weight="400">Evaluación</text>

    <!-- Estado offline discreto -->
    <circle cx="1216" cy="41" r="3" fill="#ECEFF4"/>
    <text x="1228" y="46" fill="#7D8594" font-family="Inter, sans-serif" font-size="12" font-weight="400">Autónomo</text>

    <rect x="1304" y="28" width="80" height="28" rx="14" fill="#ECEFF4"/>
    <text x="1322" y="46" fill="#0A0B0E" font-family="Inter, sans-serif" font-size="11" font-weight="600">Rutina</text>

    <line x1="56" y1="72" x2="1384" y2="72" stroke="#181B22" stroke-width="1"/>
  </g>


  <!-- Diseño editorial de 2 columnas con amplio espacio en blanco -->
  <g id="GuidedStepLeft">
    <text x="140" y="168" fill="#7D8594" font-family="Inter, sans-serif" font-size="13">Paso 2 de 3 · Toma capilar en microgravedad</text>
    <text x="140" y="218" fill="#ECEFF4" font-family="Inter, sans-serif" font-size="34" font-weight="400" letter-spacing="-0.6">Acerca el cartucho a 90°</text>
    <text x="140" y="260" fill="#ECEFF4" font-family="Inter, sans-serif" font-size="34" font-weight="400" letter-spacing="-0.6">de la esfera de sangre</text>

    <text x="140" y="320" fill="#7D8594" font-family="Inter, sans-serif" font-size="15">En microgravedad la gota no cae: permanece adherida al dedo</text>
    <text x="140" y="344" fill="#7D8594" font-family="Inter, sans-serif" font-size="15">por tensión superficial. No sacudas la mano.</text>

    <!-- Nota de modo de fallo sobria y limpia -->
    <rect x="140" y="396" width="460" height="96" rx="12" fill="#101217" stroke="#1C2029" stroke-width="1"/>
    <text x="168" y="430" fill="#ECEFF4" font-family="Inter, sans-serif" font-size="13" font-weight="500">Evita burbujas en el canal capilar</text>
    <text x="168" y="456" fill="#7D8594" font-family="Inter, sans-serif" font-size="13">La entrada de aire produce lecturas falsamente bajas (&lt;60 mg/dL).</text>
  </g>

  <!-- Derecha: Ingreso limpio del valor -->
  <g id="GuidedInputRight">
    <rect x="760" y="168" width="520" height="480" rx="20" fill="#101217" stroke="#1C2029" stroke-width="1"/>
    <text x="816" y="226" fill="#7D8594" font-family="Inter, sans-serif" font-size="13">Lectura del analizador portátil (Glucosa)</text>

    <text x="816" y="330" fill="#ECEFF4" font-family="Inter, sans-serif" font-size="76" font-weight="300" letter-spacing="-2">102</text>
    <text x="970" y="330" fill="#484F5C" font-family="Inter, sans-serif" font-size="22">mg/dL</text>

    <line x1="816" y1="368" x2="1224" y2="368" stroke="#1C2029" stroke-width="1"/>

    <text x="816" y="412" fill="#7D8594" font-family="Inter, sans-serif" font-size="13">Tu media pre-vuelo (C001)</text>
    <text x="1140" y="412" fill="#ECEFF4" font-family="Inter, sans-serif" font-size="13">89 mg/dL</text>

    <text x="816" y="452" fill="#7D8594" font-family="Inter, sans-serif" font-size="13">Rango de referencia (OSD-575)</text>
    <text x="1120" y="452" fill="#7D8594" font-family="Inter, sans-serif" font-size="13">65 – 99 mg/dL</text>

    <rect x="816" y="536" width="408" height="52" rx="12" fill="#ECEFF4"/>
    <text x="938" y="567" fill="#0A0B0E" font-family="Inter, sans-serif" font-size="14" font-weight="600">Evaluar lectura</text>
  </g>

  <text x="56" y="860" fill="#484F5C" font-family="Inter, sans-serif" font-size="11">Prototipo informativo basado en NASA OSDR OSD-575. No es un dispositivo médico.</text>
</svg>